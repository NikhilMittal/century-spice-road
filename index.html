<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Century: Spice Road</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* One visual world — a wooden trading table — so colours are painted explicitly for every host theme. */
:root{
  --wood1:#3B2214; --wood2:#2A170D; --wood3:#4E2E1B;
  --felt:#3D1B22; --felt2:#2C1218; --felt-line:#6B3A3F;
  --parch:#F1E1BF; --parch2:#E3CDA2; --parch-ink:#2B1B12; --parch-muted:#6E5238; --parch-line:#B89A6B;
  --gold:#D9AA3E; --gold2:#F4DC8C; --gold3:#8A5E12;
  --ink:#F3E6C8; --muted:#C9B48F; --line:#5A3B2B;
  --warn:#F0B75A; --ok:#8FD19A;
  --cw:118px;
}
*{box-sizing:border-box}
html{background:#2A170D}
body{margin:0;color:var(--ink);font-family:"Alegreya Sans",Georgia,serif;font-size:16px;line-height:1.4;padding-inline:16px;padding-block:12px 48px;min-height:100vh;
  background-color:var(--wood2);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px, rgba(0,0,0,.08) 9px 11px, transparent 11px 23px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 160px),
    linear-gradient(180deg,#4A2A18 0%,#301A0F 40%,#22120A 100%);
}
h1,h2,h3{font-family:Marcellus,"Times New Roman",serif;font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.cube{width:14px;height:14px;display:inline-block;vertical-align:middle;overflow:visible}
svg.cube.lg{width:24px;height:24px}
svg.coin{width:22px;height:22px;vertical-align:middle;display:inline-block}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1440px;margin:0 auto 14px}
.brand h1{font-family:Cinzel,Marcellus,serif;font-weight:800;font-size:30px;letter-spacing:.06em;color:var(--gold2);text-shadow:0 1px 0 #6B4410,0 2px 6px rgba(0,0,0,.6)}
.brand h1 span{color:var(--gold)}
.brand .sub{color:var(--muted);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #7A5A2E;background:linear-gradient(180deg,#5B3A24,#3E2616);border-radius:6px;padding:7px 14px;font-weight:500;letter-spacing:.02em;color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 4px rgba(0,0,0,.4)}
.btn:hover{background:linear-gradient(180deg,#6B4830,#4A2E1C)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#B07F22);border-color:#F1D27A;color:#2B1B12;font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:14px}

/* ---------- layout ---------- */
.table{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;max-width:1440px;margin:0 auto}
@media (max-width:1000px){.table{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.mat{position:relative;border-radius:10px;padding:12px 14px 10px;background:
  radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.06),transparent 60%),
  repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 3px,transparent 3px 6px),
  linear-gradient(180deg,var(--felt),var(--felt2));
  border:1px solid var(--felt-line);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.5) inset}
.mat::before{content:"";position:absolute;inset:6px;border:1px solid rgba(217,170,62,.35);border-radius:6px;pointer-events:none}
.mat h2{font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mat h2 .hint{font-family:"Alegreya Sans";text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:400}

/* ---------- card rows ---------- */
.row{display:flex;gap:12px;overflow-x:auto;padding:14px 4px 10px;align-items:flex-end}
.slot{flex:0 0 var(--cw);display:flex;flex-direction:column;align-items:center;gap:6px}
.coins{height:30px;display:flex;align-items:flex-end;gap:6px;font-size:13px;color:var(--muted)}
.pile{position:relative;width:34px;height:30px}
.pile svg{position:absolute;left:0;width:30px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.card{position:relative;width:var(--cw);flex:0 0 var(--cw);border:0;background:none;padding:0;border-radius:8px;display:block;line-height:0;transition:transform .14s,filter .14s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.card svg.face{width:100%;height:auto;display:block;border-radius:8px}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-6px);filter:drop-shadow(0 8px 10px rgba(0,0,0,.6)) drop-shadow(0 0 6px rgba(244,220,140,.5))}
.card.dim{opacity:.55;filter:grayscale(.25) drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.card .tip{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:#2B1B12;border:1px solid var(--gold3);border-radius:99px;padding:1px 8px;color:var(--gold2);white-space:nowrap;line-height:1.4}
.deck{flex:0 0 var(--cw);position:relative;line-height:0}
.deck svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.deck .cnt{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:600;font-size:14px;color:var(--gold2);line-height:1;text-shadow:0 1px 2px #000}
.free{font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;color:var(--gold2)}

/* ---------- players ---------- */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.pl{border-radius:8px;padding:8px 10px;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--parch-ink);display:flex;flex-direction:column;gap:6px;border:1px solid var(--parch-line);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.pl.active{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(244,220,140,.45)}
.pl .name{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:Marcellus,serif;font-size:17px}
.pl .name small{font-family:"Alegreya Sans";color:var(--parch-muted);font-size:13px}
.pl .meta{display:flex;gap:10px;font-size:13px;color:var(--parch-muted);flex-wrap:wrap;align-items:center}
.pl .meta svg.coin{width:15px;height:15px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--parch-line);border-radius:99px;padding:0 6px;color:var(--parch-muted);font-family:"Alegreya Sans"}
.minicaravan{display:flex;gap:3px;flex-wrap:wrap;min-height:18px}

/* ---------- caravan (you) ---------- */
.you .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.you .head .who{font-family:Marcellus;font-size:24px;color:var(--gold2);text-shadow:0 1px 2px #000}
.caravan{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;
  background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--parch-ink);border:1px solid var(--parch-line);box-shadow:0 2px 4px rgba(0,0,0,.5);overflow:hidden}
.caravan .camel{position:absolute;right:8px;top:2px;height:52px;opacity:.14;pointer-events:none}
.caravan .slots{display:flex;gap:6px;flex-wrap:wrap}
.cslot{width:34px;height:34px;border-radius:6px;border:1px dashed #A78B5E;background:rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center}
.cslot.over{border-color:#C0392B;background:rgba(192,57,43,.12)}
.cubebtn{background:none;border:0;padding:0;border-radius:6px;line-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.cubebtn:not(:disabled):hover svg{transform:translateY(-2px)}
.cubebtn.sel{box-shadow:0 0 0 2px var(--gold3) inset;background:rgba(217,170,62,.25)}
.cubebtn:disabled{cursor:default}
.caravan .cap{margin-left:auto;font-size:13px;color:var(--parch-muted);font-family:Cinzel,serif;letter-spacing:.08em}
.caravan .cap.over{color:#A72A1E;font-weight:700}
.hand{display:flex;gap:12px;flex-wrap:wrap;padding:12px 2px 6px}
.played .card{--cw:82px;opacity:.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--muted)}
.prompt{border:1px solid var(--gold3);background:linear-gradient(180deg,#4A2A1A,#3A2014);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.prompt .msg{flex:1 1 220px}
.payrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.payslot{width:34px;height:34px;border:1px dashed var(--gold3);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.bowls{display:flex;gap:10px;margin-left:auto}
.bowls svg{width:44px;height:34px}

/* ---------- log ---------- */
.scroll{border-radius:8px;padding:12px 14px;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--parch-ink);border:1px solid var(--parch-line);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.scroll h2{font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold3);display:flex;justify-content:space-between;margin-bottom:6px}
.scroll h2 .hint{font-family:"Alegreya Sans";text-transform:none;letter-spacing:0;font-weight:400;color:var(--parch-muted)}
.log{max-height:620px;overflow:auto;font-size:14px;display:flex;flex-direction:column}
.log div{padding:4px 0;border-bottom:1px solid #D4BE92}
.log div b{color:#8A4A12}
@media (max-width:1000px){.log{max-height:200px}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,5,3,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--parch-ink);border:2px solid var(--gold3);outline:1px solid var(--gold2);outline-offset:-6px;border-radius:12px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 14px 50px rgba(0,0,0,.6)}
.modal h2{font-family:Cinzel,serif;font-weight:600;font-size:22px;margin-bottom:8px;color:#6B4410;letter-spacing:.06em}
.modal p{margin:6px 0;max-width:64ch}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .btn{color:var(--ink)}
.setup .prow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.setup input[type=text],.setup select{font:inherit;padding:6px 8px;border:1px solid var(--parch-line);border-radius:6px;background:#FBF3E0;color:var(--parch-ink);width:100%}
.seg{display:inline-flex;border:1px solid var(--parch-line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#FBF3E0;padding:5px 12px;color:var(--parch-ink)}
.seg button.on{background:var(--gold);color:#2B1B12;font-weight:700}
.rules h3{font-family:Marcellus,serif;font-size:17px;margin:14px 0 4px;letter-spacing:.04em;color:#6B4410}
.rules ul{margin:4px 0;padding-left:20px}
.rules li{margin:3px 0}
.rules a{color:#8A4A12}
.score{width:100%;border-collapse:collapse;margin-top:10px}
.score th,.score td{padding:6px 8px;text-align:right;border-bottom:1px solid #D4BE92}
.score th:first-child,.score td:first-child{text-align:left}
.score tr.win td{color:#8A4A12;font-weight:700}

/* ---------- online ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold3);border-radius:99px;padding:5px 12px;font-size:13px;letter-spacing:.06em;color:var(--gold2);background:rgba(0,0,0,.25);align-self:center}
.chip b{font-family:Cinzel,serif;letter-spacing:.2em}
.chip.warn{border-color:#C0392B;color:#F0B75A}
.tag.off{color:#A72A1E;border-color:#A72A1E}
.menu{display:grid;gap:10px;margin:12px 0 4px}
.mopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--parch-line);background:#FBF3E0;border-radius:8px;padding:12px 14px;color:var(--parch-ink)}
.mopt:hover{border-color:var(--gold3);background:#FFF8E6}
.mopt b{font-family:Marcellus,serif;font-size:18px;color:#6B4410}
.mopt span{color:var(--parch-muted);font-size:14px}
.lbl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-muted);margin:10px 0 4px}
.lrows{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.lrow{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--parch-line);border-radius:6px;background:#FBF3E0}
.lobby a{color:#8A4A12;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2B1B12;color:var(--ink);border:1px solid var(--gold3);border-radius:8px;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- animation layer & extras ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx-piece{position:absolute;line-height:0;will-change:transform,opacity;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.fx-piece svg{width:100%;height:100%;display:block}
.card.sel{outline:2px solid var(--gold2);outline-offset:2px}
.preview{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.preview .over{color:var(--warn)}
.btn.small.on{background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#B07F22);border-color:#F1D27A;color:#2B1B12;font-weight:700}
select.lvl{font:inherit;padding:5px 8px;border:1px solid var(--parch-line);border-radius:6px;background:#FBF3E0;color:var(--parch-ink)}
.botadd{display:inline-flex;gap:6px;align-items:center}
.setup .prow{grid-template-columns:28px 1fr auto auto}

/* ---------- hints, zoom, timeline ---------- */
.card.near{opacity:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(244,220,140,.45))}
.card.near svg.face{outline:1px dashed var(--gold2);outline-offset:-3px}
.card.enables{filter:drop-shadow(0 3px 4px rgba(0,0,0,.55)) drop-shadow(0 0 7px rgba(244,220,140,.7))}
.card .badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-family:Cinzel,serif;font-size:11px;letter-spacing:.06em;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2B1B12;border-radius:99px;padding:1px 8px;white-space:nowrap;line-height:1.4;font-weight:700}
#zoom{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;gap:22px;padding:20px;background:rgba(10,5,3,.72);cursor:pointer;flex-wrap:wrap}
#zoom.show{display:flex}
#zoom .zcard{width:min(330px,70vw);flex:0 0 auto;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7))}
#zoom .zcard svg{width:100%;height:auto;display:block}
#zoom .zcap{max-width:300px;color:var(--ink);font-size:17px;line-height:1.45}
#zoom .zcap .ok{color:var(--ok)}
#zoom .zhint{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.modal.wide{max-width:760px}
.modal h3{font-family:Marcellus,serif;font-size:17px;margin:16px 0 6px;color:#6B4410;letter-spacing:.04em}
.tl{position:relative}
.tl svg{width:100%;height:auto;display:block;overflow:visible}
.tltip{position:absolute;display:none;background:#2B1B12;color:var(--ink);border:1px solid var(--gold3);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.5;pointer-events:none;white-space:nowrap}
.score.stats td:first-child{white-space:nowrap}
@media (max-width:520px){:root{--cw:100px}.brand h1{font-size:24px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div class="top">
  <div class="brand">
    <h1>Century <span>·</span> Spice Road</h1>
    <div class="sub">Caravans · Merchants · Points — a table for 2–5</div>
  </div>
  <div class="topbtns">
    <span id="roomchip"></span>
    <button class="btn" id="btnRules">How to play</button>
    <button class="btn primary" id="btnNew">New game</button>
  </div>
</div>

<div class="table" id="app"></div>
<div id="modals"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>

</body>
</html>
